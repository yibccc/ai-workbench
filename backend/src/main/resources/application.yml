spring:
  application:
    name: ai-workbench-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_workbench}}
    username: ${POSTGRES_USER:ai_workbench}
    password: ${POSTGRES_PASSWORD:local_dev_only}
    hikari:
      connection-timeout: 2000
      validation-timeout: 2000
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

server:
  address: 127.0.0.1
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

workbench:
  zone-id: Asia/Shanghai
  capture:
    lease-duration: PT5M
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    timeout: ${DEEPSEEK_TIMEOUT:PT4M}

mybatis:
  type-handlers-package: com.aiworkbench.config.mybatis
  configuration:
    map-underscore-to-camel-case: true
