spring:
  application:
    name: ai-workbench-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_workbench}}
    username: ${POSTGRES_USER:ai_workbench}
    password: ${POSTGRES_PASSWORD:local_dev_only}
    hikari:
      connection-timeout: 2000
      validation-timeout: 2000
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  session:
    store-type: redis
    timeout: 7d
    redis:
      repository-type: indexed
      namespace: workbench:session
  servlet:
    multipart:
      max-file-size: 22020096B
      max-request-size: 23068672B
      file-size-threshold: 0B
      resolve-lazily: true

server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        name: WORKBENCH_SESSION
        http-only: true
        secure: ${WORKBENCH_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

workbench:
  storage:
    provider: ${WORKBENCH_STORAGE_PROVIDER:rustfs}
    endpoint: ${WORKBENCH_STORAGE_ENDPOINT:http://127.0.0.1:9000}
    region: ${WORKBENCH_STORAGE_REGION:us-east-1}
    bucket: ${WORKBENCH_STORAGE_BUCKET:workbench-community}
    access-key: ${WORKBENCH_STORAGE_ACCESS_KEY:}
    secret-key: ${WORKBENCH_STORAGE_SECRET_KEY:}
    path-style: ${WORKBENCH_STORAGE_PATH_STYLE:true}
    connect-timeout: ${WORKBENCH_STORAGE_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${WORKBENCH_STORAGE_READ_TIMEOUT:PT30S}
    api-call-attempt-timeout: ${WORKBENCH_STORAGE_API_CALL_ATTEMPT_TIMEOUT:PT60S}
    api-call-timeout: ${WORKBENCH_STORAGE_API_CALL_TIMEOUT:PT120S}
    reservation-duration: ${WORKBENCH_STORAGE_RESERVATION_DURATION:PT5M}
  auth:
    bootstrap-username: ${WORKBENCH_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${WORKBENCH_BOOTSTRAP_PASSWORD:}
  zone-id: Asia/Shanghai
  report:
    ai:
      timeout: ${REPORT_AI_TIMEOUT:PT6M}
      max-tokens: ${REPORT_AI_MAX_TOKENS:4096}
  capture:
    lease-duration: PT5M
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    timeout: ${DEEPSEEK_TIMEOUT:PT4M}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-handlers-package: com.aiworkbench.config.mybatis
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: postgresql
  reasonable: false
  support-methods-arguments: false
  page-size-zero: false
