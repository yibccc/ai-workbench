name: ai-workbench

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-ai_workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-PT4M}
      REPORT_AI_TIMEOUT: ${REPORT_AI_TIMEOUT:-PT6M}
      REPORT_AI_MAX_TOKENS: ${REPORT_AI_MAX_TOKENS:-4096}
      WORKBENCH_WS_ALLOWED_ORIGINS: ${WORKBENCH_WS_ALLOWED_ORIGINS:-http://127.0.0.1:8088,http://localhost:8088}
      WORKBENCH_BOOTSTRAP_USERNAME: ${WORKBENCH_BOOTSTRAP_USERNAME:-}
      WORKBENCH_BOOTSTRAP_PASSWORD: ${WORKBENCH_BOOTSTRAP_PASSWORD:-}
      WORKBENCH_COOKIE_SECURE: ${WORKBENCH_COOKIE_SECURE:-false}
      WORKBENCH_STORAGE_PROVIDER: rustfs
      WORKBENCH_STORAGE_ENDPOINT: http://rustfs:9000
      WORKBENCH_STORAGE_REGION: ${WORKBENCH_STORAGE_REGION:-us-east-1}
      WORKBENCH_STORAGE_BUCKET: ${WORKBENCH_STORAGE_BUCKET:-workbench-community}
      WORKBENCH_STORAGE_ACCESS_KEY: ${WORKBENCH_STORAGE_ACCESS_KEY:-}
      WORKBENCH_STORAGE_SECRET_KEY: ${WORKBENCH_STORAGE_SECRET_KEY:-}
      WORKBENCH_STORAGE_PATH_STYLE: "true"
      WORKBENCH_STORAGE_CONNECT_TIMEOUT: ${WORKBENCH_STORAGE_CONNECT_TIMEOUT:-PT2S}
      WORKBENCH_STORAGE_READ_TIMEOUT: ${WORKBENCH_STORAGE_READ_TIMEOUT:-PT30S}
      WORKBENCH_STORAGE_API_CALL_ATTEMPT_TIMEOUT: ${WORKBENCH_STORAGE_API_CALL_ATTEMPT_TIMEOUT:-PT60S}
      WORKBENCH_STORAGE_API_CALL_TIMEOUT: ${WORKBENCH_STORAGE_API_CALL_TIMEOUT:-PT120S}
      WORKBENCH_STORAGE_RESERVATION_DURATION: ${WORKBENCH_STORAGE_RESERVATION_DURATION:-PT5M}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-ai_workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set a separate RustFS management access key}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set a separate RustFS management secret key}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "--fail", "--silent", "--show-error", "--noproxy", "127.0.0.1", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
