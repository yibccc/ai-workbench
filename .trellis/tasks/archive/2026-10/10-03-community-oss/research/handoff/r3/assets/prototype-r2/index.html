function inlineMarkdown(text){return esc(text).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);}

function markdown(body,files){
  const lines=body.split('\n');let out='',paragraph=[],list=[],code=[],inCode=false,headingNo=0;const flushP=()=>{if(paragraph.length){out+=`<p>${paragraph.map(inlineMarkdown).join('<br>')}</p>`;paragraph=[];}};const flushL=()=>{if(list.length){out+=`<ul>${list.map(l=>`<li>${inlineMarkdown(l)}</li>`).join('')}</ul>`;list=[];}};
  for(const line of lines){
    if(line.startsWith('```')){flushP();flushL();if(inCode){out+=`<pre><code>${esc(code.join('\n'))}</code></pre>`;code=[];}inCode=!inCode;continue;}
    if(inCode){code.push(line);continue;}
    const img=line.match(/^!\[([^\]]*)\]\(attachment:([^)]+)\)$/);
    if(img){flushP();flushL();const f=files.find(x=>x.id===img[2]&&x.kind==='image'&&x.status==='ready');out+=f?imageHTML(f):'<p class="muted">[图片已移除或尚未就绪]</p>';continue;}
    if(/^#{1,3} /.test(line)){flushP();flushL();const level=line.match(/^#+/)[0].length===3?3:2;out+=`<h${level} id="section-${headingNo++}">${inlineMarkdown(line.replace(/^#+ /,''))}</h${level}>`;continue;}
    if(line.startsWith('> ')){flushP();flushL();out+=`<blockquote>${inlineMarkdown(line.slice(2))}</blockquote>`;continue;}
    if(line.startsWith('- ')){flushP();list.push(line.slice(2));continue;}
    flushL();if(!line.trim()){flushP();continue;}paragraph.push(line);
  }
  flushP();flushL();if(inCode)out+=`<pre><code>${esc(code.join('\n'))}</code></pre>`;
  return out;
}

    const ext=file.name.split('.').pop().toLowerCase();const kind=['jpg','jpeg','png','webp'].includes(ext)?'image':ext==='pdf'?'pdf':ext==='md'?'md':null;
    if(!kind){errors.push(`${file.name}：只支持 JPG、PNG、WebP、PDF、MD。`);continue;}
    if(file.size>LIMITS[kind]){errors.push(`${file.name}：超过${kind==='image'?'图片 5':kind==='pdf'?'PDF 20':'MD 1'} MiB 上限。`);continue;}
    const q=quotaError([...p.draft.attachments,{size:file.size}]);if(q){errors.push(q);continue;}
    const entry={id:'upload-'+(++state.sequence),name:file.name,kind,size:file.size,status:'uploading',demo:false};p.draft.attachments.push(entry);markDirty(p);
    // Sequential reservation occurs before await, so UI concurrency cannot overbook this local model.
    try{
      const bytes=new Uint8Array(await file.slice(0,16).arrayBuffer());
      const looks=(ext==='png'?bytes.length>=8&&bytes[0]===137&&bytes[1]===80&&bytes[2]===78&&bytes[3]===71:ext==='jpg'||ext==='jpeg'?bytes[0]===255&&bytes[1]===216&&bytes[2]===255:ext==='webp'?String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP':ext==='pdf'?String.fromCharCode(...bytes.slice(0,5))==='%PDF-':true);
      if(!looks)throw new Error('扩展名与文件头不匹配');
      if(ext==='md'){const content=await file.arrayBuffer();new TextDecoder('utf-8',{fatal:true}).decode(content);}
      if(kind==='image')entry.url=URL.createObjectURL(file);
      await new Promise(r=>setTimeout(r,250));entry.status='ready';
    }catch(err){entry.status='failed';entry.validationFailed=true;errors.push(`${file.name}：本地演示校验失败，请换用有效测试文件。`);}
  }
  state.uploadError=[...new Set(errors)].join(' ');if(state.user===p.author&&state.route==='/editor/'+p.id)render();
}
function setupDrop(){const dz=document.getElementById('dropzone');if(!dz)return;dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragging');});dz.addEventListener('dragleave',()=>dz.classList.remove('dragging'));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragging');addFiles([...e.dataTransfer.files]);});}
function changeIdentity(value,expired=false){const p=activePost();if(p?.dirty){p.draft=clone(p.saved);p.dirty=false;}state.user=value==='anon'?null:value;state.modal=null;state.consent=false;state.selected.clear();state.sourcePage=0;state.filter='all';state.manageFilter='all';state.uploadError='';closeModal();render();window.scrollTo(0,0);if(expired)notify('模拟会话已失效，受保护内容已从界面移除。',true);}
function openModal(config){lastModalFocus=document.activeElement;state.modal=config;renderModal();}
function closeModal(){state.modal=null;document.getElementById('modal-root').innerHTML='';document.body.style.overflow='';if(lastModalFocus?.isConnected)lastModalFocus.focus();}
function renderModal(){
  const m=state.modal;if(!m)return;let title='',body='',actions='',wide=false;
  if(m.type==='leave'){title='还有未保存的修改';body='<p>你可以先保存到当前演示会话再离开。保存不会更新读者看到的发布版本。</p>';actions=button('继续编辑','close-modal','','secondary')+button('放弃修改','discard-leave','','ghost')+button('保存并离开','save-leave');}
  if(m.type==='withdraw'){title='撤回这篇内容？';body='<p>撤回后，广场和作者主页不再展示该内容，新的读者请求也不能读取正文或附件。</p><div class="hint-box">原始工作记录不受影响。已被他人复制、截图或下载的副本无法收回。此处只模拟界面状态。</div>';actions=button('暂不撤回','close-modal','','secondary')+button('确认撤回','confirm-withdraw',`data-post-id="${m.id}"`,'danger');}
  if(m.type==='type-change'){title='新建另一种内容？';body='<p>不会把当前文章强行改成另一种类型。当前修改保存为私有草稿，再打开新的编辑器。</p>';actions=button('继续当前编辑','close-modal','','secondary')+button('保存并新建','confirm-type',`data-value="${m.value}"`);}
  if(m.type==='tools'){title='原型状态演示';body='<p>以下操作只改变本页内存数据，不属于正式产品功能。刷新页面可以恢复全部示例。</p><div class="demo-options">'+button(icon('logout')+' 模拟会话失效','expire','','secondary')+button(icon('refresh')+' 模拟广场加载失败','demo-error','','secondary')+button(icon('file')+' 模拟广场空状态','demo-empty','','secondary')+button(icon('upload')+' 模拟附件上传失败','demo-upload','','secondary')+button(icon('shield')+' 模拟当前内容被下架','demo-hide','','secondary')+button(icon('refresh')+' 恢复正常列表','feed-retry','','secondary')+'</div>';}
  if(m.type==='image'){title=m.file.name;wide=true;body=`<div class="image-dialog-content">${m.file.url?`<img src="${esc(m.file.url)}" alt="${esc(m.file.name)}">`:diagramHTML()}</div><p style="font-size:11px;margin-top:14px">${m.file.demo?'示例插图以 HTML/CSS 绘制，不是真实上传文件。':'本地测试文件预览，不会上传 OSS。'}</p>`;}
  if(m.type==='copy'){title='站内链接已准备好';body=`<p>这个地址只能在本地原型中使用，不是真实网站的分享链接。</p><input aria-label="原型链接" style="width:100%;margin-top:15px;padding:10px;border:1px solid var(--border);border-radius:7px" readonly value="${esc(m.link)}">`;actions=button('知道了','close-modal');}
  document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="close-row"><div class="eyebrow">WORKBENCH / PROTOTYPE</div><button class="icon-btn" data-action="close-modal" aria-label="关闭对话框">${icon('close')}</button></div><h2 id="dialog-title">${esc(title)}</h2>${body}${actions?`<div class="dialog-actions">${actions}</div>`:''}</section></div>`;document.body.style.overflow='hidden';requestAnimationFrame(()=>document.querySelector('.dialog button')?.focus());
}
root.addEventListener('input',e=>{const p=activePost();if(!canEdit(p))return;const map={'post-title':'title','post-summary':'summary','post-body':'body'};if(map[e.target.id]){p.draft[map[e.target.id]]=e.target.value;markDirty(p);}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='demo-identity'){changeIdentity(el.value);return;}
  if(el.dataset.sourceId){el.checked?state.selected.add(el.dataset.sourceId):state.selected.delete(el.dataset.sourceId);const y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(el.id==='source-date'){state.sourceDate=el.value;state.sourcePage=0;state.selected.clear();state.includeFocus=false;render();return;}
  if(el.id==='include-focus'){state.includeFocus=el.checked;return;}
  if(el.id==='publish-consent'||el.matches('[data-publish-consent]')){state.consent=el.checked;document.querySelectorAll('[data-action="publish"]').forEach(b=>b.disabled=!el.checked);document.querySelectorAll('[data-publish-consent="true"]').forEach(c=>c.checked=el.checked);return;}
  if(el.id==='file-picker'){addFiles([...el.files]);el.value='';}
});
document.addEventListener('click',async e=>{
  const target=e.target.closest('[data-action],[data-nav]');if(!target)return;
  const action=target.dataset.action;const data=target.dataset;
  if(data.nav){e.preventDefault();navigation(data.nav);return;}if(target.disabled)return;
  e.preventDefault();const p=activePost();
  switch(action){
    case 'skip':document.getElementById('main-content')?.focus();break;
    case 'close-toast':document.getElementById('toast').hidden=true;break;
    case 'home':navigation('/community');break;
    case 'compose':navigation('/compose');break;
    case 'new-daily':state.selected.clear();state.sourcePage=0;state.sourceDate=DEMO_DATE;navigation('/sources');break;
    case 'new-note':newPost('note');break;case 'new-blog':newPost('blog');break;
    case 'feed-filter':state.filter=data.value;render();break;
    case 'manage-filter':state.manageFilter=data.value;render();break;
    case 'source-prev':state.sourcePage=Math.max(0,state.sourcePage-1);render();break;
    case 'source-next':state.sourcePage++;render();break;
    case 'generate-daily':{
      const selected=RECORDS.filter(r=>state.selected.has(r.id));if(!selected.length)return;
      const outcomes=selected.filter(r=>!r.minutes);const focus=selected.filter(r=>r.minutes).reduce((n,r)=>n+r.minutes,0);
      const body=(outcomes.length?'## 今天的进展\n'+outcomes.map(r=>'- '+r.title).join('\n'):'')+(state.includeFocus&&focus?`\n\n## 专注投入\n本次选中的专注合计 ${focus} 分钟。投入不等于任务完成。`:'')+'\n\n## 一点收获\n';
      newPost('daily',{title:state.sourceDate.slice(5).replace('-',' 月 ')+' 日，今天的进展',date:state.sourceDate,body:body.trim(),selectedIds:selected.map(r=>r.id)});break;
    }
    case 'switch-type':if(canEdit(p)&&data.value!==p.draft.type)openModal({type:'type-change',value:data.value});break;
    case 'confirm-type':{const value=data.value;if(canEdit(p))saveDraft(p,true);closeModal();if(value==='daily')navigation('/sources',true);else newPost(value);break;}
    case 'save':if(p)saveDraft(p);break;
    case 'format':{
      const textarea=document.getElementById('post-body');if(!textarea||!canEdit(p))return;const start=textarea.selectionStart,end=textarea.selectionEnd,selection=textarea.value.slice(start,end);
      const text={heading:'\n## '+(selection||'小标题')+'\n',bold:'**'+(selection||'重点内容')+'**',list:'\n- '+(selection||'一条进展')+'\n',code:'\n```\n'+(selection||'示例代码')+'\n```\n'}[data.value];textarea.setRangeText(text,start,end,'end');p.draft.body=textarea.value;markDirty(p);textarea.focus();break;
    }
    case 'preview':{if(!canEdit(p))return;const error=validateDraft(p);if(error){notify(error,true);return;}state.consent=false;navigation('/preview/'+p.id,true);break;}
    case 'back-edit':navigation('/editor/'+data.postId,true);break;
    case 'publish':{
      if(!canEdit(p)||!state.consent||state.busy||p.status==='hidden')return;const error=validateDraft(p);if(error){notify(error,true);return;}state.busy=true;document.querySelectorAll('[data-action="publish"]').forEach(b=>{b.disabled=true;b.textContent='正在发布…';});const owner=state.user;await new Promise(r=>setTimeout(r,300));
      if(owner!==state.user||!canEdit(p)){state.busy=false;return;}const updating=p.status==='published';p.saved=clone(p.draft);p.published=clone(p.draft);p.status='published';p.dirty=false;p.hasEdits=false;p.version++;if(!updating){p.order=100+(++state.sequence);p.time='刚刚';}state.busy=false;state.consent=false;navigation('/post/'+p.id,true);notify(updating?'发布更新已在原型中生效，读者看到新版本。':'已在原型中发布到站内广场。');break;
    }
    case 'edit-post':{const item=getPost(data.postId);if(!canEdit(item)||item.status==='hidden')return;state.uploadError='';navigation('/editor/'+item.id);break;}
    case 'read-post':navigation('/post/'+data.postId);break;
    case 'withdraw':openModal({type:'withdraw',id:data.postId});break;
    case 'confirm-withdraw':{const item=getPost(data.postId);if(!canEdit(item))return;item.status='withdrawn';closeModal();render();notify('已在原型中撤回，新的读者访问不再显示正文和附件。');break;}
    case 'pick-files':document.getElementById('file-picker')?.click();break;
    case 'remove-file':{
      if(!canEdit(p))return;p.draft.attachments=p.draft.attachments.filter(f=>f.id!==data.fileId);
      p.draft.body=p.draft.body.split('\n').filter(line=>!line.includes('(attachment:'+data.fileId+')')).join('\n');markDirty(p);state.uploadError='';const y=window.scrollY;render();window.scrollTo(0,y);break;
    }
    case 'insert-image':{if(!canEdit(p))return;const f=p.draft.attachments.find(x=>x.id===data.fileId);if(!f)return;p.draft.body+=`\n\n![${f.name.replace(/[\[\]\r\n]/g,'')}](attachment:${f.id})`;markDirty(p);const y=window.scrollY;render();window.scrollTo(0,y);notify('图片已插入正文，可在发布前预览中查看。');break;}
    case 'retry-file':{if(!canEdit(p))return;const f=p.draft.attachments.find(x=>x.id===data.fileId);if(f?.validationFailed){notify('请移除校验失败的文件，再选择有效测试文件。',true);return;}if(f){f.status='ready';state.uploadError='';markDirty(p);render();notify('模拟重试完成。未调用真实上传服务。');}break;}
    case 'download':{const item=getPost(data.postId);const isPreview=state.route==='/preview/'+item?.id&&canEdit(item);if(!state.user||(!isPreview&&!isVisible(item))){render();notify('当前没有读取权限。',true);return;}notify('原型仅演示鉴权后的下载反馈，未传输实际 PDF 或 MD 文件。');break;}
    case 'zoom-image':{if(!p||(!canEdit(p)&&!isVisible(p)))return;const collection=state.route.startsWith('/preview/')?p.draft:p.published;const f=collection?.attachments.find(x=>x.id===data.fileId);if(f)openModal({type:'image',file:f});break;}
    case 'copy-link':{const link=location.href.split('#')[0]+'#/post/'+data.postId;try{await navigator.clipboard.writeText(link);notify('已复制本地原型链接；这不是真实网站地址。');}catch{openModal({type:'copy',link});}break;}
    case 'scroll-section':document.getElementById('section-'+data.value)?.scrollIntoView({behavior:'smooth',block:'start'});break;
    case 'demo-tools':openModal({type:'tools'});break;
    case 'close-modal':closeModal();break;
    case 'save-leave':{const dest=state.modal.target;saveDraft(p,true);navigation(dest,true);break;}
    case 'discard-leave':{const dest=state.modal.target;if(p){p.draft=clone(p.saved);p.dirty=false;}navigation(dest,true);break;}
    case 'expire':changeIdentity('anon',true);break;
    case 'login':changeIdentity(data.value);notify('已以演示身份进入，并返回目标页面。');break;
    case 'demo-error':state.demoFeed='error';navigation('/community',true);break;
    case 'demo-empty':state.demoFeed='empty';navigation('/community',true);break;
    case 'feed-retry':state.demoFeed='normal';closeModal();render();break;
    case 'demo-upload':{
      closeModal();const editable=canEdit(p)&&state.route.startsWith('/editor/')?p:ownPosts().find(x=>x.id==='draft-1')||ownPosts()[0];if(!editable){notify('当前演示账号没有草稿。请先新建内容。');return;}
      let f=editable.draft.attachments[0];if(!f){f={id:'failed-'+(++state.sequence),name:'练习截图.png',kind:'image',size:MiB,status:'failed',demo:true};editable.draft.attachments.push(f);}f.status='failed';f.validationFailed=false;editable.dirty=true;state.uploadError='模拟 OSS 上传失败。正文可以保存，附件就绪前不能发布。';navigation('/editor/'+editable.id,true);break;
    }
    case 'demo-hide':{if(p&&p.status==='published'){p.status='hidden';closeModal();render();notify('已模拟下架。正式管理角色和下架操作尚未在此实现。');}else{closeModal();notify('请先打开一篇已发布内容，再演示下架。');}break;}
  }
});
document.addEventListener('keydown',e=>{if(!state.modal)return;if(e.key==='Escape'){e.preventDefault();closeModal();return;}if(e.key==='Tab'){const nodes=[...document.querySelectorAll('.dialog button,.dialog a,.dialog input,.dialog textarea,.dialog select')].filter(x=>!x.disabled);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1)||'/community';const bypass=state.skipNextHashGuard;state.skipNextHashGuard=false;if(!bypass&&hasDirty()&&!sameDraftFlow(next)){history.replaceState(null,'','#'+state.route);openModal({type:'leave',target:next});return;}state.route=next;closeModal();render();window.scrollTo(0,0);document.getElementById('main-content')?.focus({preventScroll:true});});
window.addEventListener('beforeunload',e=>{if(state.posts.some(p=>p.dirty)){e.preventDefault();e.returnValue='';}});

window.prototypeDemo={state,LIMITS,quotaError,validateDraft,newPost,changeIdentity,getPost,render,navigation};
